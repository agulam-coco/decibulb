[build-system]
requires = ["setuptools>=77"]  # 77+ supports SPDX license strings
build-backend = "setuptools.build_meta"

[project]
name = "decibulb"
description = "Turn an old mixer into a light switch."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jason Chigabatia" }]
requires-python = ">=3.11"
dynamic = ["version"]  # read from decibulb.__version__
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
decibulb = "decibulb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "decibulb.__version__" }

[tool.setuptools.package-data]
decibulb = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]